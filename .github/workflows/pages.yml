name: Deploy Athman to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify Quran divisions and app files
        run: |
          node --check dist/assets/app.js
          node --check dist/assets/divisions.js
          node --check dist/assets/pwa.js
          node --check dist/assets/recitation.js
          node --check dist/assets/recitation-ui.js
          if [ -f dist/assets/support.js ]; then node --check dist/assets/support.js; fi
          node --check dist/sw.js
          node test-divisions.cjs
          node test-pwa.cjs
          node test-recitation.cjs
          python3 validate.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload app
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy app
        id: deployment
        uses: actions/deploy-pages@v4
