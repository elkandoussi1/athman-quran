name: Deploy Athman to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify Quran divisions and app files
        run: |
          for file in dist/assets/*.js dist/sw.js; do node --check "$file"; done
          for test in test-*.cjs; do node "$test"; done
          python3 validate.py
      - name: Verify optional ASR service contract
        run: |
          python3 -m pip install -r server/requirements-test.txt
          python3 -m unittest discover -s server -p 'test_*.py'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload app
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy app
        id: deployment
        uses: actions/deploy-pages@v4
